name: Emulator Live Test (APK real Android par chalake screenshots)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'game/**'
      - 'android/**'
      - '.github/workflows/emulator-test.yml'

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      # KVM ko enable karo -> emulator hardware-accelerated chalega
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run app on emulator + capture screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -x
            adb wait-for-device
            adb shell settings put global window_animation_scale 0 || true
            adb shell settings put system screen_off_timeout 1800000 || true
            # emulator slow hai -> ANR dialogs band karo (warna screenshot me dialog aa jata hai)
            adb shell settings put global anr_show_background 0 || true
            adb shell settings put secure anr_show_background 0 || true
            adb shell svc power stayon true || true
            adb shell input keyevent KEYCODE_WAKEUP || true
            adb shell wm dismiss-keyguard || true
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            mkdir -p screenshots/android
            # pehle HOME screen ka screenshot -> pata chale ki display/screencap theek hai ya nahi
            adb shell input keyevent KEYCODE_HOME || true
            sleep 3
            adb exec-out screencap -p > screenshots/android/00-home.png
            adb shell dumpsys power | grep -E "mWakefulness=|Display Power" > screenshots/android/power.txt || true
            adb shell dumpsys display | grep -E "mState=|Display Power" | head -5 >> screenshots/android/power.txt || true
            shot () {  # $1 = file, $2 = screen
              adb shell am force-stop com.sakura.strike
              adb shell am start --es screen "$2" -n com.sakura.strike/.MainActivity
              sleep 12
              adb shell am broadcast -a android.intent.action.CLOSE_SYSTEM_DIALOGS > /dev/null 2>&1 || true
              adb exec-out screencap -p > "screenshots/android/$1.png"
            }
            shot 01-lobby lobby
            shot 02-shop shop
            shot 03-ranks rank
            shot 04-settings set
            shot 05-match match
            sleep 6
            adb exec-out screencap -p > screenshots/android/06-match-play.png
            adb logcat -d -s SakuraStrike:* > screenshots/android/app-log.txt || true
            adb logcat -d > screenshots/android/logcat-full.txt || true
            adb logcat -d -s SakuraStrike:* chromium:* AndroidRuntime:E > screenshots/android/logcat.txt || true
            adb shell dumpsys window | grep -E "mCurrentFocus" > screenshots/android/focus-after.txt || true
            ls -lh screenshots/android

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: emulator-screenshots
          path: screenshots/android/
          retention-days: 30
