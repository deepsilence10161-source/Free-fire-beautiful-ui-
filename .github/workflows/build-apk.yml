name: Build Sakura Strike APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7 (AGP 8.5.x ke liye)
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Verify game assets APK me hain
        working-directory: android
        run: |
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q "assets/index.html"
          echo "OK: assets/index.html APK ke andar hai"
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep assets/

      - name: Show APK
        working-directory: android
        run: ls -lh app/build/outputs/apk/debug/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SakuraStrike-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
