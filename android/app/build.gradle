plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sakura.strike'
    // build-tools 34.0.0 default ke liye (kuch runners me 35 gayab hota hai)
    compileSdk 34

    defaultConfig {
        applicationId "com.sakura.strike"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "0.1"
        buildToolsVersion "34.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            // debug-signed so you can install the APK directly on your phone
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // ship the game files inside the APK
    // NOTE: path app/ se relative hai -> repo root ka game/ folder = ../../game
    sourceSets {
        main {
            assets.srcDirs += ['../../game']
            assets.srcDirs += [file('src/main/assets')]
        }
    }
}

dependencies {
}
